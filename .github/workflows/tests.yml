name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      PYTHONIOENCODING: utf-8
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[training,test]"
      - name: Test offline with tiny locally constructed encoders
        run: python -m pytest -q
      - name: Verify report snapshot hashes
        run: python scripts/verify_medical_snapshots.py
