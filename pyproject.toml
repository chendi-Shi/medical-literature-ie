[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-training-lab"
version = "0.3.0"
description = "Chinese entity and relation extraction with reproducible NLP experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.5,<2", "joblib>=1.3,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
training = ["torch>=2.6,<3", "transformers>=5.9,<5.10", "peft>=0.19,<0.20", "safetensors>=0.4,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
report = ["matplotlib>=3.8,<4"]

[project.scripts]
nlp-lab = "nlp_lab.cli:main"
nlp-ie = "nlp_lab.ie_commands:main"

[tool.setuptools.packages.find]
include = ["nlp_lab*"]

[tool.setuptools.package-data]
nlp_lab = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
